<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./gallery.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" as="style" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<template id="__bundler_thumbnail" data-bg-color="#ffffff">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#ffffff"/>
    <text x="600" y="120" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="64" fill="#000">atoman</text>
    <rect x="120" y="220" width="240" height="320" fill="#ededed"/>
    <rect x="380" y="220" width="240" height="200" fill="#ededed"/>
    <rect x="640" y="220" width="240" height="260" fill="#ededed"/>
    <rect x="900" y="220" width="180" height="360" fill="#ededed"/>
    <rect x="120" y="560" width="240" height="180" fill="#ededed"/>
    <rect x="380" y="440" width="240" height="300" fill="#ededed"/>
    <rect x="640" y="500" width="240" height="200" fill="#ededed"/>
    <rect x="900" y="600" width="180" height="140" fill="#ededed"/>
  </svg>
</template>
<style>
  *{box-sizing:border-box}
  html{scrollbar-gutter:stable both-edges !important;overflow-y:scroll !important;scrollbar-width:thin;scrollbar-color:transparent transparent}
  html::-webkit-scrollbar{width:8px}
  html::-webkit-scrollbar-track{background:transparent}
  html::-webkit-scrollbar-thumb{background:transparent}
  html:hover::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.2)}
  html,body{margin:0}
  body{background:#fff;color:#000;font-family:'Pretendard Variable','Pretendard',-apple-system,system-ui,sans-serif;font-weight:500;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;color:inherit}
  a{color:#000;text-decoration:none}
  a:hover{text-decoration:underline}
  img{display:block;max-width:100%}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#e0e0e0;border-radius:6px}
  .design-card .ext-hint{opacity:0;transition:opacity .18s ease}
  .design-card:hover .ext-hint{opacity:1}
  @media (hover:none){.design-card .ext-hint{opacity:1}}
</style>
</helmet>

<!-- ===== HEADER (sticky, fixed height, opaque) ===== -->
<header style="position:sticky;top:0;z-index:30;background:#fff;border-bottom:{{ headerBorder }};padding:0 {{ sidePad }}px">
  <div style="display:flex;flex-direction:column;align-items:center;padding:16px 0 12px">
    <div style="position:relative;width:100%;display:flex;align-items:center;justify-content:center">
      <button onClick="{{ goMain }}" aria-label="atoman home" style="background:none;border:none;cursor:pointer;padding:0;line-height:0;text-decoration:none">

      </button>
      <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
        <button onClick="{{ toggleMenu }}" aria-label="menu" style="position:absolute;right:0;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:6px;line-height:0">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"><path d="M4 7h16"></path><path d="M4 12h16"></path><path d="M4 17h16"></path></svg>
        </button>
      </sc-if>
    </div>
    <sc-if value="{{ showNavRow }}" hint-placeholder-val="{{ true }}">
      <nav style="display:flex;gap:{{ navGap }}px;margin-top:12px">
        <sc-for list="{{ navItems }}" as="n" hint-placeholder-count="4">
          <button onClick="{{ n.onClick }}" style="background:none;border:none;cursor:pointer;padding:2px 1px 4px;font-size:{{ navFont }}px;font-weight:{{ n.weight }};color:#000;border-bottom:{{ n.border }}">{{ n.label }}</button>
        </sc-for>
      </nav>
    </sc-if>
    <sc-if value="{{ mobileMenuOpen }}" hint-placeholder-val="{{ false }}">
      <nav style="display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:12px;width:100%">
        <sc-for list="{{ navItems }}" as="n" hint-placeholder-count="4">
          <button onClick="{{ n.onClick }}" style="background:none;border:none;cursor:pointer;padding:10px;font-size:18px;font-weight:{{ n.weight }};color:#000;width:100%">{{ n.label }}</button>
        </sc-for>
      </nav>
    </sc-if>
    <sc-if value="{{ showSubtabs }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;justify-content:center;flex-wrap:wrap;gap:{{ subGap }}px;margin-top:16px">
        <sc-for list="{{ subtabItems }}" as="t" hint-placeholder-count="4">
          <button onClick="{{ t.onClick }}" style="background:none;border:none;cursor:pointer;padding:2px 1px 4px;font-size:{{ subFont }}px;font-weight:{{ t.weight }};color:#000;border-bottom:{{ t.border }}">{{ t.label }}</button>
        </sc-for>
      </div>
    </sc-if>
  </div>
</header>

<!-- ===== BODY ===== -->
<main style="padding:24px {{ sidePad }}px 0;min-height:60vh">

  <!-- MAIN / PHOTOGRAPHY : masonry -->
  <sc-if value="{{ showGallery }}" hint-placeholder-val="{{ true }}">
    <div>
      <div style="display:flex;gap:{{ gutter }}px;align-items:flex-start;justify-content:center">
        <sc-for list="{{ galleryCols }}" as="col" hint-placeholder-count="4">
          <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:{{ gutter }}px">
            <sc-for list="{{ col.cards }}" as="card" hint-placeholder-count="4">
              <div onClick="{{ card.onClick }}" class="{{ card.cls }}" style="position:relative;width:100%;aspect-ratio:{{ card.ratio }};background:#ededed;overflow:hidden;cursor:pointer">
                <sc-if value="{{ card.isDesign }}" hint-placeholder-val="{{ false }}">
                  <div class="ext-hint" style="position:absolute;top:9px;right:9px;pointer-events:none;line-height:0">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 1px 2px rgba(0,0,0,0.5))"><path d="M7 17L17 7"></path><path d="M8 7h9v9"></path></svg>
                  </div>
                </sc-if>
              </div>
            </sc-for>
          </div>
        </sc-for>
      </div>
      <div ref="{{ setSentinel }}" style="height:1px"></div>
    </div>
  </sc-if>

  <!-- DESIGN : project articles -->
  <sc-if value="{{ isDesign }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-direction:column;gap:{{ projGap }}px;padding-top:8px">
      <sc-for list="{{ designProjects }}" as="p" hint-placeholder-count="2">
        <article style="display:flex;flex-direction:column;gap:28px">
          <div style="display:grid;grid-template-columns:{{ gCols }};align-items:end;gap:16px 0">
            <h2 style="grid-column:{{ titleCol }};margin:0;font-weight:700;font-size:{{ titleSize }}px;line-height:1.12;letter-spacing:-.02em">{{ p.title }}</h2>
            <div style="grid-column:{{ dateCol }};font-size:14px;font-weight:500;padding-bottom:6px">{{ p.date }}</div>
            <div style="grid-column:{{ designerCol }};font-size:14px;font-weight:600;padding-bottom:6px">{{ p.designer }}</div>
          </div>
          <div style="width:100%;aspect-ratio:3/1;background:#ededed"></div>
          <div style="display:grid;grid-template-columns:{{ gCols }};gap:24px 0;padding-top:4px">
            <div style="grid-column:{{ credCol }}">
              <sc-for list="{{ p.credits }}" as="c" hint-placeholder-count="3">
                <div style="font-weight:500;font-size:14px;line-height:2">{{ c }}</div>
              </sc-for>
            </div>
            <div style="grid-column:{{ longCol }}">
              <p style="margin:0 0 26px;font-weight:600;font-size:16px;line-height:1.8">{{ p.textKo }}</p>
              <p style="margin:0;font-weight:500;font-size:13px;line-height:1.8">{{ p.textEn }}</p>
            </div>
          </div>
        </article>
      </sc-for>
    </div>
  </sc-if>

  <!-- CONTACT -->
  <sc-if value="{{ isContact }}" hint-placeholder-val="{{ false }}">
    <div style="padding-top:8px;display:flex;flex-direction:column;gap:44px">
      <div style="width:100%;aspect-ratio:3/1;background:#ededed"></div>
      <div style="display:grid;grid-template-columns:{{ gCols }};align-items:start;gap:32px 0">
        <div style="grid-column:{{ titleCol }};font-weight:700;font-size:{{ titleSize }}px;line-height:1.08;letter-spacing:-.02em">atoman</div>
        <div style="grid-column:{{ longCol }};display:flex;flex-direction:column;gap:32px;padding-right:{{ contactPadRight }}px">
          <div style="display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:16px;line-height:1.7">
            <span>AI Creatives</span>
            <span>Graphics</span>
            <span>Brand building</span>
            <span>Photography</span>
          </div>
          <div style="display:flex;flex-direction:column;gap:6px;font-weight:500;font-size:15px;line-height:1.7">
            <a href="mailto:97yjbusiness@gmail.com">e-mail</a>
            <a href="https://www.behance.net" target="_blank">Behance</a>
            <a href="https://www.notion.so" target="_blank">Notion</a>
          </div>
        </div>
      </div>
    </div>
  </sc-if>

</main>

<!-- ===== FOOTER (every page) ===== -->
<footer style="background:#fff;border-top:1px solid #000;margin-top:80px;padding:40px {{ sidePad }}px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px">
  <div style="display:flex;align-items:center;gap:14px;font-weight:600;font-size:14px">
    <a href="https://www.behance.net" target="_blank">Behance</a>
    <span>·</span>
    <a href="https://www.instagram.com" target="_blank">Instagram</a>
    <span>·</span>
    <a href="https://www.notion.so" target="_blank">Notion</a>
  </div>
  <a href="mailto:97yjbusiness@gmail.com" style="font-weight:500;font-size:14px">97yjbusiness@gmail.com</a>
  <p style="margin:0;font-weight:500;font-size:13px">© 2026 atoman</p>
</footer>

<!-- ===== LIGHTBOX ===== -->
<sc-if value="{{ lbOpen }}" hint-placeholder-val="{{ false }}">
  <div onClick="{{ overlayClick }}" style="position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center">
    <button onClick="{{ closeLightbox }}" aria-label="close" style="position:absolute;top:18px;right:18px;background:none;border:none;cursor:pointer;padding:8px;line-height:0;z-index:2">
      <svg width="26" height="26" viewBox="0 0 24 24" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
    </button>
    <button onClick="{{ lbPrev }}" aria-label="prev" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:12px;line-height:0;z-index:2">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </button>
    <div style="width:{{ lbWidth }};aspect-ratio:{{ lbRatio }};background:#e8e8e8"></div>
    <button onClick="{{ lbNext }}" aria-label="next" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:12px;line-height:0;z-index:2">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
    </button>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900}}">
// ===== DATA =====
// 실제 데이터는 gallery.js 파일에 있음. 여기선 그걸 읽어오기만 함.
// 사진 추가/수정은 gallery.js 에서만 하면 됨. (이 파일은 손댈 필요 없음)
const gallery = (window.GALLERY || []);
const projects = (window.PROJECTS || []);

const BIO = "사진과 디자인으로 순간을 기록합니다 — atoman";

class Component extends DCLogic {
  state = {
    screen: 'main', photoTab: 'model', designTab: 'ai',
    bp: 'desktop', menuOpen: false, scrolled: false,
    mainCount: 12, photoCount: 12,
    lbOpen: false, lbList: [], lbIndex: 0,
  };

  setSentinel = (node) => {
    this._sentinel = node;
    if (this.io) { this.io.disconnect(); if (node) this.io.observe(node); }
  };

  componentDidMount() {
    this.mqM = window.matchMedia('(max-width: 640px)');
    this.mqT = window.matchMedia('(min-width: 641px) and (max-width: 1024px)');
    this.recalcBp = () => {
      const bp = this.mqM.matches ? 'mobile' : this.mqT.matches ? 'tablet' : 'desktop';
      this.setState(s => s.bp === bp ? null : { bp, menuOpen: false });
    };
    this.mqM.addEventListener('change', this.recalcBp);
    this.mqT.addEventListener('change', this.recalcBp);
    this.recalcBp();

    this.onScroll = () => {
      const sc = (window.scrollY || document.documentElement.scrollTop || 0) > 0;
      this.setState(s => s.scrolled === sc ? null : { scrolled: sc });
    };
    window.addEventListener('scroll', this.onScroll, { passive: true });

    this.onKey = (e) => {
      if (!this.state.lbOpen) return;
      if (e.key === 'Escape') this.closeLightbox();
      else if (e.key === 'ArrowLeft') this.lbPrev();
      else if (e.key === 'ArrowRight') this.lbNext();
    };
    window.addEventListener('keydown', this.onKey);

    // Observer only nudges maybeFill on scroll; the real decision measures the
    // sentinel's live position, so it works identically for Main and every
    // Photography category regardless of observer re-attach timing.
    this.io = new IntersectionObserver(() => this.maybeFill(), { rootMargin: '400px 0px' });
    if (this._sentinel) this.io.observe(this._sentinel);
  }

  // Load the active gallery's next batch if the sentinel is on/near screen.
  // Bumps +12 per call; componentDidUpdate re-invokes after render so batches
  // chain until the sentinel is pushed out of view (fixes mid-scroll stall,
  // and works for whichever category's gallery is currently mounted).
  maybeFill() {
    const s = this.state;
    if (s.screen !== 'main' && s.screen !== 'photography') return;
    const key = s.screen === 'main' ? 'mainCount' : 'photoCount';
    if (s[key] >= (this.currentSourceLen || 0)) return;
    const node = this._sentinel;
    if (!node) return;
    const rect = node.getBoundingClientRect();
    if (rect.top <= (window.innerHeight || 0) + 400) {
      this.setState(state => ({ [key]: state[key] + 12 }));
    }
  }

  componentDidUpdate() {
    // Re-check after every render: chains batches while the sentinel stays near
    // the viewport, and re-arms cleanly after a tab switch remounts the gallery.
    this.maybeFill();
  }

  componentWillUnmount() {
    this.mqM && this.mqM.removeEventListener('change', this.recalcBp);
    this.mqT && this.mqT.removeEventListener('change', this.recalcBp);
    window.removeEventListener('scroll', this.onScroll);
    window.removeEventListener('keydown', this.onKey);
    this.io && this.io.disconnect();
    document.body.style.overflow = '';
  }

  scrollTop() { window.scrollTo(0, 0); if (document.documentElement) document.documentElement.scrollTop = 0; if (document.body) document.body.scrollTop = 0; }
  // Scroll always resets on navigation; Main's counter PERSISTS (only Photography's resets).
  go(screen) { this.scrollTop(); this.setState({ screen, menuOpen: false, photoCount: 12, scrolled: false }); }
  setPhotoTab(cat) { this.scrollTop(); this.setState({ photoTab: cat, photoCount: 12, scrolled: false }); }
  setDesignTab(tab) { this.scrollTop(); this.setState({ designTab: tab, scrolled: false }); }
  toggleMenu() { this.setState(s => ({ menuOpen: !s.menuOpen })); }

  openLightbox(list, idx) { document.body.style.overflow = 'hidden'; this.setState({ lbOpen: true, lbList: list, lbIndex: idx }); }
  closeLightbox() { document.body.style.overflow = ''; this.setState({ lbOpen: false }); }
  lbNext() { this.setState(s => ({ lbIndex: (s.lbIndex + 1) % s.lbList.length })); }
  lbPrev() { this.setState(s => ({ lbIndex: (s.lbIndex - 1 + s.lbList.length) % s.lbList.length })); }
  openBehance(href) { window.open(href || 'https://www.behance.net', '_blank'); }

  // Masonry packing: keep array order (so the interleaved orientation shows), place each
  // card in the shortest column — but when heights are near-equal, prefer a column whose
  // last card has a DIFFERENT orientation, so portraits/landscapes don't stack per-column.
  packMasonry(cards, n) {
    const cols = Array.from({ length: n }, () => ({ cards: [], h: 0, last: null }));
    cards.forEach(c => {
      const o = c.h > c.w ? 'p' : 'l';
      let best = 0, bestScore = Infinity;
      for (let i = 0; i < n; i++) {
        // 0.35 ≈ half a card-height unit: only overrides height when columns are near-tied
        const score = cols[i].h + (cols[i].last === o ? 0.35 : 0);
        if (score < bestScore) { bestScore = score; best = i; }
      }
      cols[best].cards.push(c);
      cols[best].h += c.h / c.w;
      cols[best].last = o;
    });
    return cols;
  }

  renderVals() {
    const s = this.state;
    const bp = s.bp;
    const isMobile = bp === 'mobile';
    const columns = bp === 'mobile' ? 2 : bp === 'tablet' ? 3 : 4;
    const sidePad = bp === 'mobile' ? 12 : bp === 'tablet' ? 18 : 24;
    const gutter = 16;
    const navGap = bp === 'mobile' ? 16 : bp === 'tablet' ? 22 : 30;
    const subGap = bp === 'mobile' ? 14 : bp === 'tablet' ? 20 : 26;
    const navFont = bp === 'desktop' ? 17 : 16;
    const subFont = bp === 'mobile' ? 14 : bp === 'tablet' ? 15 : 16;
    const titleSize = bp === 'mobile' ? 26 : bp === 'tablet' ? 32 : 40;
    const projGap = bp === 'mobile' ? 72 : bp === 'tablet' ? 92 : 112;

    const nav = [['main','Main'],['design','Design'],['photography','Photography'],['contact','Contact']];
    const navItems = nav.map(([key, label]) => ({
      label, onClick: () => this.go(key),
      weight: s.screen === key ? 700 : 500,
      border: s.screen === key ? '2px solid #000' : '2px solid transparent',
    }));

    const showSubtabs = s.screen === 'photography' || s.screen === 'design';
    let subtabItems = [];
    if (s.screen === 'photography') {
      const tabs = [['model','Model'],['snap','Snap'],['street','Candid Street'],['landscape','Landscape']];
      subtabItems = tabs.map(([key, label]) => ({
        label, onClick: () => this.setPhotoTab(key),
        weight: s.photoTab === key ? 700 : 500,
        border: s.photoTab === key ? '2px solid #000' : '2px solid transparent',
      }));
    } else if (s.screen === 'design') {
      const tabs = [['ai','AI Creative'],['graphic','Graphic & Branding']];
      subtabItems = tabs.map(([key, label]) => ({
        label, onClick: () => this.setDesignTab(key),
        weight: s.designTab === key ? 700 : 500,
        border: s.designTab === key ? '2px solid #000' : '2px solid transparent',
      }));
    }

    let source = [];
    if (s.screen === 'main') source = gallery;
    else if (s.screen === 'photography') source = gallery.filter(g => g.type === 'photo' && g.cat === s.photoTab);
    this.currentSourceLen = source.length;

    const count = s.screen === 'main' ? s.mainCount : s.photoCount;
    const visible = source.slice(0, count);
    const photoList = visible.filter(g => g.type === 'photo');
    let pIdx = -1;
    const cards = visible.map(g => {
      if (g.type === 'photo') {
        pIdx++; const idx = pIdx;
        return { ratio: g.w + '/' + g.h, w: g.w, h: g.h, cls: 'gallery-card', isDesign: false,
                 onClick: () => this.openLightbox(photoList, idx) };
      }
      return { ratio: g.w + '/' + g.h, w: g.w, h: g.h, cls: 'design-card', isDesign: true,
               onClick: () => this.openBehance(g.href) };
    });
    const showGallery = s.screen === 'main' || s.screen === 'photography';
    const galleryCols = showGallery ? this.packMasonry(cards, columns) : [];

    const designProjects = projects.filter(p => p.tab === s.designTab).map(p => ({
      ...p, heroRatio: p.hero.w + '/' + p.hero.h,
    }));

    const gCols = isMobile ? '1fr' : 'repeat(4, 1fr)';
    const titleCol = isMobile ? 'auto' : '1 / 3';
    const dateCol = isMobile ? 'auto' : '3 / 4';
    const designerCol = isMobile ? 'auto' : '4 / 5';
    const credCol = isMobile ? 'auto' : '1 / 3';
    const longCol = isMobile ? 'auto' : '3 / 5';
    const metaDir = isMobile ? 'column' : 'row';
    const metaAlign = isMobile ? 'flex-start' : 'flex-end';
    const contactPadRight = isMobile ? 0 : bp === 'tablet' ? 40 : 80;

    const cur = s.lbList[s.lbIndex];
    const ratio = cur ? cur.w / cur.h : 1;
    const lbWidth = 'min(92vw, calc(88vh * ' + ratio + '))';
    const lbRatio = cur ? cur.w + '/' + cur.h : '1/1';

    return {
      isMobile, sidePad, gutter, navGap, subGap, navFont, subFont, titleSize, projGap,
      headerBorder: s.scrolled ? '1px solid #000' : '1px solid transparent',
      showNavRow: !isMobile, mobileMenuOpen: isMobile && s.menuOpen,
      goMain: () => this.go('main'),
      toggleMenu: () => this.toggleMenu(),
      navItems, showSubtabs, subtabItems,
      showGallery, galleryCols, setSentinel: this.setSentinel,
      isDesign: s.screen === 'design', designProjects, gCols, titleCol, dateCol, designerCol, credCol, longCol, metaDir, metaAlign, contactPadRight,
      isContact: s.screen === 'contact', bio: BIO,
      lbOpen: s.lbOpen, lbWidth, lbRatio,
      overlayClick: (e) => { if (e.target === e.currentTarget) this.closeLightbox(); },
      closeLightbox: () => this.closeLightbox(),
      lbPrev: () => this.lbPrev(), lbNext: () => this.lbNext(),
    };
  }
}
</script>
</body>
</html>
